[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kotone"
version = "0.1.0"
description = "Raspberry Pi 向け日本語ネイティブ音楽プレイヤーのバックエンド"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",   # m3u インポートのファイルアップロードに必要
    "python-mpd2>=3.1.1",
    "mutagen>=1.47",
    "Pillow>=10.2",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fugashi>=1.3",
    "unidic-lite>=1.0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.3",
]

[project.scripts]
kotone-backend = "kotone.__main__:main"
kotone-cli = "kotone.cli:main"

[tool.setuptools.packages.find]
include = ["kotone*"]

[tool.setuptools.package-data]
kotone = ["db/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
